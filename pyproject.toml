[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bothunter"
version = "0.1.0"
description = "Local-first personal job search automation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-bdd>=7.3",
    "ruff>=0.9",
]

[project.scripts]
bothunter-recorder = "tools.recorder.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["bothunter*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
